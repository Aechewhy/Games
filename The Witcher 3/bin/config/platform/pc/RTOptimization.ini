; Path Tracing Optimization for The Witcher 3 Remastered, v2.0
; Needs xinput9_1_0.dll from this mod in bin\x64_dx12.

; --- Path tracing: light bounces (vanilla 2). The biggest gain, especially indoors.
[Rendering/RT/PathTracer]
PTNumBounces=1
; Brightness of bounced light (1.0 = vanilla). Makes up for the removed bounce.
PTIndirectLightMultiplier=1.05
